name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published advisories surface even when nobody is pushing.
    - cron: '0 13 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npm test -- --runInBand --coverage

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Production dependencies only; fails on high/critical advisories.
      - run: npm run audit:prod
      - run: npm audit --omit=dev --audit-level=high
        working-directory: loyalpass-portal

  portal:
    name: Portal lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loyalpass-portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: loyalpass-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [backend]
    env:
      # Throwaway values that satisfy the production config checks; never reused anywhere real.
      AUTH_SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123
      PLATFORM_ADMIN_EMAIL: ci@example.com
      PLATFORM_ADMIN_PASSWORD: ci-only-admin-password
      DB_PASSWORD: ci-only-database-password
      APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Start backend stack (postgres, migrations, app)
        run: docker compose --profile backend up -d --build

      - name: Wait for /health
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/health; then echo; exit 0; fi
            sleep 2
          done
          echo "App did not become healthy" >&2
          docker compose --profile backend logs
          exit 1

      - name: Migration job succeeded
        run: |
          code=$(docker inspect -f '{{.State.ExitCode}}' loyalpass-migrate)
          test "$code" = "0"

      - name: Container runs as non-root
        run: |
          uid=$(docker exec loyalpass-app id -u)
          echo "uid=$uid"
          test "$uid" != "0"

      - name: Logs are structured JSON with a request ID
        run: |
          curl -fsS -H 'X-Request-Id: ci-smoke-0001' http://localhost:3000/api/does-not-exist > /dev/null || true
          docker logs loyalpass-app 2>&1 | grep '"requestId":"ci-smoke-0001"'

      - name: Graceful shutdown on SIGTERM
        run: |
          docker stop -t 15 loyalpass-app
          code=$(docker inspect -f '{{.State.ExitCode}}' loyalpass-app)
          echo "exit code: $code"
          test "$code" = "0"

      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile backend logs

      - name: Tear down
        if: always()
        run: docker compose --profile backend down -v
